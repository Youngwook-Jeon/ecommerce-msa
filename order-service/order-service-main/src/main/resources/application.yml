server:
  port: 9003

issuer-uri: http://localhost:8080/realms/Ecomart

schema:
  name: orders

order-service:
  guest-cart:
    enabled: true
    key-prefix: "ecomart:order:cart:guest:"
    ttl-seconds: 2592000
    cookie:
      name: guest_cart_id
      path: /
      max-age-seconds: 2592000
  product-catalog:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:9002}
    connect-timeout-ms: 2000
    read-timeout-ms: 3000
  product-inventory:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:9002}
    connect-timeout-ms: 2000
    read-timeout-ms: 3000
  payment-reconciliation:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:9004}
    connect-timeout-ms: 2000
    read-timeout-ms: 3000
  saga-events:
    enabled: true
    payment-completed-topic: payment.completed
    payment-failed-topic: payment.failed
    payment-completed-consumer-group: order-service-payment-completed
    payment-failed-consumer-group: order-service-payment-failed
    payment-completed-dlt-topic: payment.completed.DLT
    payment-completed-dlt-consumer-group: order-service-payment-completed-dlt
    payment-failed-dlt-topic: payment.failed.DLT
    payment-failed-dlt-consumer-group: order-service-payment-failed-dlt
    consumer:
      # Pluggable: retry-then-dlt (default). Add a new KafkaListenerFailureStrategy bean to switch.
      failure-strategy: ${ORDER_SAGA_FAILURE_STRATEGY:retry-then-dlt}
      retry:
        # FixedBackOff maxAttempts: retries after the first failure (3 → retry up to 3 times, then DLT).
        max-attempts: ${ORDER_SAGA_RETRY_MAX_ATTEMPTS:3}
        backoff-interval-ms: ${ORDER_SAGA_RETRY_BACKOFF_MS:1000}
      dlt:
        topic-suffix: ${ORDER_SAGA_DLT_SUFFIX:.DLT}
    compensation:
      # CDC executes refunds. The scheduler only reconciles a durable Payment-side processing record.
      reconciliation:
        fixed-delay-ms: ${ORDER_COMPENSATION_RECONCILIATION_DELAY_MS:30000}
        grace-period-ms: ${ORDER_COMPENSATION_RECONCILIATION_GRACE_MS:300000}
      observation:
        # Pluggable: file (default). Add an ELK CompensationObservationStrategy bean later.
        strategy: ${ORDER_COMPENSATION_OBSERVATION_STRATEGY:file}
        file:
          path: ${ORDER_COMPENSATION_OBSERVATION_FILE:./logs/saga-compensation.jsonl}

kafka-config:
  bootstrap-servers: localhost:19092, localhost:29092, localhost:39092
  schema-registry-url-key: schema.registry.url
  schema-registry-url: http://localhost:8081
  num-of-partitions: 3
  replication-factor: 3

resilience4j:
  circuitbreaker:
    instances:
      productCatalog:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 3s
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        # 4xx (our request is wrong) must not count toward the failure rate.
        ignore-exceptions:
          - com.project.young.orderservice.application.port.output.ProductCatalogClientException
      inventoryReservation:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 3s
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - com.project.young.orderservice.application.port.output.InventoryReservationClientException
          - com.project.young.orderservice.application.port.output.InventoryReservationConflictException
      paymentRefundReconciliation:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 3s
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - com.project.young.orderservice.application.port.output.PaymentReconciliationClientException
  timelimiter:
    instances:
      productCatalog:
        timeout-duration: 4s
        cancel-running-future: true
      inventoryReservation:
        timeout-duration: 4s
        cancel-running-future: true

spring:
  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 2s
      timeout: 1s
  datasource:
    url: jdbc:postgresql://localhost:5432/ecodb_order?currentSchema=${schema.name}&binaryTransfer=true&reWriteBatchedInserts=true
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    schemas: ${schema.name}

  jpa:
    open-in-view: false
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ${schema.name}
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${issuer-uri}

  sql:
    init:
      platform: init
      mode: never

logging:
  level:
    org:
      springframework:
        security: INFO
      hibernate:
        engine:
          jdbc:
            batch:
              internal: DEBUG
