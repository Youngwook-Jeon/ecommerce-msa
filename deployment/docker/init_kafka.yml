version: '3.7'

services:
  init-kafka:
    image: confluentinc/cp-kafka:${KAFKA_VERSION}
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      set -eu

      # block until kafka is reachable
      kafka-topics --bootstrap-server kafka-broker-1:9092 --list

      # Normal startup preserves existing events and Kafka Connect state.
      echo 'Ensuring Kafka topics exist'
      kafka-topics --bootstrap-server kafka-broker-1:9092 --create --if-not-exists --topic product --replication-factor 3 --partitions 3
      kafka-topics --bootstrap-server kafka-broker-1:9092 --create --if-not-exists --topic product.catalog.changed --replication-factor 3 --partitions 3
      kafka-topics --bootstrap-server kafka-broker-1:9092 --create --if-not-exists --topic product.catalog.changed.search.DLT --replication-factor 3 --partitions 3
      kafka-topics --bootstrap-server kafka-broker-1:9092 --create --if-not-exists --topic order.created --replication-factor 3 --partitions 3
      kafka-topics --bootstrap-server kafka-broker-1:9092 --create --if-not-exists --topic order.created.DLT --replication-factor 3 --partitions 3
      kafka-topics --bootstrap-server kafka-broker-1:9092 --create --if-not-exists --topic payment.completed --replication-factor 3 --partitions 3
      kafka-topics --bootstrap-server kafka-broker-1:9092 --create --if-not-exists --topic payment.completed.DLT --replication-factor 3 --partitions 3
      kafka-topics --bootstrap-server kafka-broker-1:9092 --create --if-not-exists --topic payment.failed --replication-factor 3 --partitions 3
      kafka-topics --bootstrap-server kafka-broker-1:9092 --create --if-not-exists --topic payment.failed.DLT --replication-factor 3 --partitions 3
      kafka-topics --bootstrap-server kafka-broker-1:9092 --create --if-not-exists --topic payment.refund.requested --replication-factor 3 --partitions 3
      kafka-topics --bootstrap-server kafka-broker-1:9092 --create --if-not-exists --topic payment.refund.requested.DLT --replication-factor 3 --partitions 3
      kafka-topics --bootstrap-server kafka-broker-1:9092 --create --if-not-exists --topic customer.refund.requested --replication-factor 3 --partitions 3
      kafka-topics --bootstrap-server kafka-broker-1:9092 --create --if-not-exists --topic customer.refund.requested.DLT --replication-factor 3 --partitions 3
      kafka-topics --bootstrap-server kafka-broker-1:9092 --create --if-not-exists --topic customer.refund.completed --replication-factor 3 --partitions 3
      kafka-topics --bootstrap-server kafka-broker-1:9092 --create --if-not-exists --topic customer.refund.completed.DLT --replication-factor 3 --partitions 3
      kafka-topics --bootstrap-server kafka-broker-1:9092 --create --if-not-exists --topic customer.refund.failed --replication-factor 3 --partitions 3
      kafka-topics --bootstrap-server kafka-broker-1:9092 --create --if-not-exists --topic customer.refund.failed.DLT --replication-factor 3 --partitions 3
      kafka-topics --bootstrap-server kafka-broker-1:9092 --create --if-not-exists --topic inventory.release.requested --replication-factor 3 --partitions 3
      kafka-topics --bootstrap-server kafka-broker-1:9092 --create --if-not-exists --topic inventory.release.requested.DLT --replication-factor 3 --partitions 3
      kafka-topics --bootstrap-server kafka-broker-1:9092 --create --if-not-exists --topic _connect_configs --replication-factor 3 --partitions 1 --config cleanup.policy=compact
      kafka-topics --bootstrap-server kafka-broker-1:9092 --create --if-not-exists --topic _connect_offsets --replication-factor 3 --partitions 25 --config cleanup.policy=compact
      kafka-topics --bootstrap-server kafka-broker-1:9092 --create --if-not-exists --topic _connect_statuses --replication-factor 3 --partitions 5 --config cleanup.policy=compact

      # Existing or automatically created internal topics must also have the required policy.
      kafka-configs --bootstrap-server kafka-broker-1:9092 --entity-type topics --entity-name _connect_configs --alter --add-config cleanup.policy=compact
      kafka-configs --bootstrap-server kafka-broker-1:9092 --entity-type topics --entity-name _connect_offsets --alter --add-config cleanup.policy=compact
      kafka-configs --bootstrap-server kafka-broker-1:9092 --entity-type topics --entity-name _connect_statuses --alter --add-config cleanup.policy=compact

      echo -e 'Successfully created the following topics:'
      kafka-topics --bootstrap-server kafka-broker-1:9092 --list
      "
    networks:
      - ${GLOBAL_NETWORK:-kafka}
