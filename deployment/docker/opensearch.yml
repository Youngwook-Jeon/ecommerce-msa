services:
  eco-opensearch:
    build:
      context: ./opensearch
    image: ecomart-opensearch:3.9.0-nori
    container_name: eco-opensearch
    environment:
      discovery.type: single-node
      cluster.name: ecomart-search
      node.name: eco-opensearch
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms${OPENSEARCH_HEAP_SIZE:-512m} -Xmx${OPENSEARCH_HEAP_SIZE:-512m}"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - ./volumes/opensearch/data:/usr/share/opensearch/data
    networks:
      - ${GLOBAL_NETWORK:-ecomart}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error --max-time 8
          'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s'
          | grep -Eq '"timed_out"[[:space:]]*:[[:space:]]*false'
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

