schema:
  name: payments

issuer-uri: http://test-issuer

payment-service:
  provider: stub
  stub-payment:
    always-succeed: true
  saga-events:
    enabled: false

spring:
  flyway:
    enabled: true
    schemas: ${schema.name}
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${schema.name}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Empty so Boot does not fetch OIDC metadata from the fake issuer-uri.
          # Kafka ITs supply a JwtDecoder bean via PaymentIntegrationTestConfiguration.
          issuer-uri:

logging:
  level:
    org.springframework.kafka: WARN
    org.apache.kafka: WARN
