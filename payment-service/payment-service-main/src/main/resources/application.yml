server:
  port: 9004

issuer-uri: http://localhost:8080/realms/Ecomart

schema:
  name: payments

payment-service:
  # stub (default) | stripe
  provider: ${PAYMENT_PROVIDER:stub}
  stub-payment:
    always-succeed: true
    decline-when-fractional-part: "0.99"
  stripe:
    api-key: ${STRIPE_API_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  saga-events:
    enabled: true
    order-created-topic: order.created
    order-created-consumer-group: payment-service-order-created
    refund-requested-topic: payment.refund.requested
    refund-requested-consumer-group: payment-service-refund-requested
    refund-requested-dlt-topic: payment.refund.requested.DLT
    refund-requested-dlt-consumer-group: payment-service-refund-requested-dlt
    consumer:
      retry:
        max-attempts: ${PAYMENT_SAGA_RETRY_MAX_ATTEMPTS:3}
        backoff-interval-ms: ${PAYMENT_SAGA_RETRY_BACKOFF_MS:1000}
      dlt:
        topic-suffix: ${PAYMENT_SAGA_DLT_SUFFIX:.DLT}
    refund-dlt-replay:
      fixed-delay-ms: ${PAYMENT_REFUND_DLT_REPLAY_DELAY_MS:30000}
      lease-ms: ${PAYMENT_REFUND_DLT_REPLAY_LEASE_MS:300000}
      max-attempts: ${PAYMENT_REFUND_DLT_REPLAY_MAX_ATTEMPTS:5}
  provider-session-request:
    fixed-delay-ms: ${PAYMENT_PROVIDER_SESSION_REQUEST_DELAY_MS:1000}
    lease-ms: ${PAYMENT_PROVIDER_SESSION_REQUEST_LEASE_MS:300000}
    max-attempts: ${PAYMENT_PROVIDER_SESSION_REQUEST_MAX_ATTEMPTS:5}

kafka-config:
  bootstrap-servers: localhost:19092, localhost:29092, localhost:39092
  schema-registry-url-key: schema.registry.url
  schema-registry-url: http://localhost:8081
  num-of-partitions: 3
  replication-factor: 3

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ecodb_payment?currentSchema=${schema.name}&binaryTransfer=true&reWriteBatchedInserts=true
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    schemas: ${schema.name}

  jpa:
    open-in-view: false
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ${schema.name}
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${issuer-uri}

  sql:
    init:
      platform: init
      mode: never

logging:
  level:
    org:
      springframework:
        security: INFO
